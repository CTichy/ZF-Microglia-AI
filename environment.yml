name: skin-seg
channels:
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # CUDA runtime for CuPy JIT compilation (Linux + CUDA only)
  - nvidia::cuda-nvrtc

  - pip:
    # ── PyTorch (CUDA 12.6 — works with driver ≥ 525 up to 12.8) ────────
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.7.0+cu126
    - torchvision==0.22.0+cu126

    # ── GPU acceleration ─────────────────────────────────────────────────
    - cupy-cuda12x
    - cucim-cu12

    # ── Core scientific stack ────────────────────────────────────────────
    - numpy>=1.20
    - scipy
    - scikit-image
    - scikit-learn
    - tifffile
    - imagecodecs
    - skan

    # ── MONAI ────────────────────────────────────────────────────────────
    - monai>=1.0

    # ── Cellpose-SAM (Tab 2 — Cellpose-SAM Segmentation) ─────────────────
    - cellpose
    - superqt

    # ── Napari + plugins ─────────────────────────────────────────────────
    - "napari[all]>=0.5"
    - napari-console
    - napari-svg
    - napari-label-focus
    - napari-3d-ortho-viewer
    - napari-segment-blobs-and-things-with-membranes
    - napari-assistant
    - napari-time-slicer
    - napari-tools-menu
    - napari-workflows

    # ── IMS file reader ──────────────────────────────────────────────────
    - imaris-ims-file-reader

    # ── Description backends (Tab 3) ─────────────────────────────────────
    - openai
    - anthropic
    - requests

    # ── Plugin ───────────────────────────────────────────────────────────
    - "napari-skin-remover @ git+https://github.com/CTichy/napari-skin-remover.git"
