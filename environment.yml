name: zf-microglia-ai
channels:
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  # CUDA runtime for CuPy JIT compilation (Windows/Linux with NVIDIA GPU; not needed on Mac)
  - nvidia::cuda-nvrtc

  - pip:
    # ── PyTorch (CUDA 12.6 — works with driver ≥ 525 up to 12.8) ────────
    - --extra-index-url https://download.pytorch.org/whl/cu126
    - torch==2.7.0+cu126
    - torchvision==0.22.0+cu126

    # ── GPU acceleration ─────────────────────────────────────────────────
    # cupy-cuda12x has Windows + Linux wheels — powers Tab 2 GPU labelling.
    # cucim-cu12 is Linux/WSL2-only (RAPIDS, no Windows wheels) — it only
    # accelerates Tab 3 batch statistics, which falls back to CPU cleanly
    # when cuCIM is absent, so it's skipped on native Windows.
    - cupy-cuda12x
    - cucim-cu12; sys_platform == "linux"

    # ── Core scientific stack ────────────────────────────────────────────
    - numpy>=1.20
    - scipy
    - scikit-image
    - scikit-learn
    - tifffile
    - imagecodecs
    - skan

    # ── MONAI ────────────────────────────────────────────────────────────
    - monai>=1.0

    # ── Cellpose-SAM (Tab 2 — Cellpose-SAM Segmentation) ─────────────────
    - cellpose
    - superqt

    # ── AI Tools (Tab 4 — GT annotation, MONAI/Cellpose-SAM training) ────
    - pandas
    - psutil

    # ── Encrypted credential storage (SMTP app password, LLM API key) ───
    # OS-native store (Windows Credential Manager / macOS Keychain /
    # Linux Secret Service) instead of the plugin's own plaintext
    # config.json. Falls back gracefully if unavailable -- see _secrets.py.
    - keyring

    # ── Napari + plugins ─────────────────────────────────────────────────
    - "napari[all]>=0.5"
    - napari-console
    - napari-svg
    - napari-label-focus
    - napari-3d-ortho-viewer
    - napari-segment-blobs-and-things-with-membranes
    - napari-assistant
    - napari-time-slicer
    - napari-tools-menu
    - napari-workflows

    # ── IMS file reader ──────────────────────────────────────────────────
    - imaris-ims-file-reader

    # ── Description backends (Tab 3) ─────────────────────────────────────
    - openai
    - anthropic
    - requests

    # ── Plugin ───────────────────────────────────────────────────────────
    - "napari-zf-microglia-ai @ git+https://github.com/CTichy/ZF-Microglia-AI.git"
