[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-zf-microglia-ai"
version = "0.3.0"
description = "ZF-Microglia-AI napari plugin — zebrafish brain extraction, microglia segmentation (Pixel Classifier / Cellpose-SAM), AI-assisted statistics, and AI Tools (GT annotation, MONAI/Cellpose-SAM training)"
requires-python = ">=3.8"
dependencies = ["napari", "monai", "tifffile", "numpy", "qtpy", "superqt", "cellpose", "scipy", "pandas", "psutil", "keyring", "cryptography"]

[project.scripts]
zf-microglia-ai = "napari_zf_microglia_ai.__main__:main"

[project.entry-points."napari.manifest"]
napari-zf-microglia-ai = "napari_zf_microglia_ai:napari.yaml"

[tool.setuptools.packages.find]
where = ["."]
include = ["napari_zf_microglia_ai*"]

[tool.setuptools.package-data]
"napari_zf_microglia_ai" = ["napari.yaml", "training_scripts/*.py"]
